[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "padme-asm"
version = "0.1.0"
description = "Padmé — Attack Surface Monitoring com alertas multi-canal"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "dnspython>=2.9.2",   # versões anteriores têm CVE-2026-114605 e CVE-2026-128089
    "PyYAML>=6.0",
    "cryptography>=42.0",
    "python-dotenv>=1.0",
    "publicsuffixlist>=1.0",   # domínio registrável (dangling CNAME genérico)
]

[project.scripts]
padme = "padme.__main__:run"   # entrada leve: --update antes de importar a CLI

[tool.setuptools.packages.find]
include = ["padme*"]

[tool.setuptools.package-data]
padme = ["data/*.json", "data/*.png"]   # base de takeover + logo do painel

[tool.pytest.ini_options]
# Garante que a raiz do repositório entre no sys.path ao rodar `pytest`
# diretamente (sem `python -m`), como faz o CI — sem isso os testes falham
# com ModuleNotFoundError: No module named 'padme'.
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "passive_sources: o teste usa as fontes passivas (com MockTransport) em vez do bloqueio padrão",
]

[tool.ruff.lint]
# Conjunto enxuto e de alto valor: pyflakes (bugs reais: nomes indefinidos,
# imports não usados), ordenação de imports e avisos do pycodestyle. Evita
# regras estilísticas ruidosas (linhas longas intencionais, blind-except
# defensivo) que não indicam defeito neste projeto pequeno.
select = ["F", "I", "W"]

[tool.mypy]
# `mypy` (sem argumentos) checa o pacote inteiro. Os módulos da lista abaixo
# rodam no modo estrito; os demais entram nela aos poucos, um por vez.
python_version = "3.11"
packages = ["padme"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["padme.web", "padme.web.*", "padme.paths", "padme.updater", "padme.initcfg"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_subclassing_any = true
check_untyped_defs = true
warn_return_any = true
no_implicit_reexport = true
extra_checks = true
