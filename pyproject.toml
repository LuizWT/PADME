[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "padme-asm"
version = "0.1.0"
description = "Padmé — Attack Surface Monitoring com alerta no Telegram"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "dnspython>=2.6",
    "PyYAML>=6.0",
    "cryptography>=42.0",
    "python-dotenv>=1.0",
]

[project.scripts]
padme = "padme.cli:main"

[tool.setuptools.packages.find]
include = ["padme*"]
