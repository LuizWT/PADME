[build-system]
requires = ["setuptools>=77"]   # 77+: licença como expressão SPDX (PEP 639)
build-backend = "setuptools.build_meta"

[project]
name = "padme-asm"
dynamic = ["version"]           # fonte única: padme/__init__.py
description = "Monitora a superfície de ataque dos seus domínios e avisa quando algo muda"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Luiz Felipe" }]
requires-python = ">=3.11"
keywords = ["attack surface", "asm", "monitoring", "subdomain takeover", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Natural Language :: Portuguese (Brazilian)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "httpx>=0.27",
    "dnspython>=2.9.2",   # versões anteriores têm CVE-2026-114605 e CVE-2026-128089
    "PyYAML>=6.0",
    "cryptography>=42.0",
    "python-dotenv>=1.0",
    "publicsuffixlist>=1.0",   # domínio registrável (dangling CNAME genérico)
]

[project.urls]
Homepage = "https://github.com/LuizWT/PADME"
Documentation = "https://github.com/LuizWT/PADME/tree/main/docs"
Issues = "https://github.com/LuizWT/PADME/issues"
Changelog = "https://github.com/LuizWT/PADME/blob/main/CHANGELOG.md"

[project.scripts]
padme = "padme.__main__:run"   # entrada leve: --update antes de importar a CLI

[tool.setuptools.dynamic]
version = { attr = "padme.__version__" }

[tool.setuptools.packages.find]
include = ["padme*"]

[tool.setuptools.package-data]
padme = ["data/*.json", "data/*.png"]   # base de takeover + logo do painel

[tool.pytest.ini_options]
# Garante que a raiz do repositório entre no sys.path ao rodar `pytest`
# diretamente (sem `python -m`), como faz o CI — sem isso os testes falham
# com ModuleNotFoundError: No module named 'padme'.
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "passive_sources: o teste usa as fontes passivas (com MockTransport) em vez do bloqueio padrão",
]

[tool.ruff.lint]
# Conjunto enxuto e de alto valor: pyflakes (bugs reais: nomes indefinidos,
# imports não usados), ordenação de imports e avisos do pycodestyle. Evita
# regras estilísticas ruidosas (linhas longas intencionais, blind-except
# defensivo) que não indicam defeito neste projeto pequeno.
select = ["F", "I", "W"]

[tool.mypy]
# `mypy` (sem argumentos) checa o pacote inteiro. Os módulos da lista abaixo
# rodam no modo estrito; os demais entram nela aos poucos, um por vez.
python_version = "3.11"
packages = ["padme"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["padme.web", "padme.web.*", "padme.paths", "padme.updater", "padme.initcfg"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_subclassing_any = true
check_untyped_defs = true
warn_return_any = true
no_implicit_reexport = true
extra_checks = true
