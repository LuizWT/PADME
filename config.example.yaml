# ─────────────────────────────────────────────────────────────
#  Padmé — Attack Surface Monitoring
#  Copie para config.yaml e ajuste. Monitore SOMENTE ativos seus
#  ou que você tem autorização explícita para testar.
# ─────────────────────────────────────────────────────────────

# Confirmação de escopo — precisa ser true para o Padmé rodar.
scope_confirmed: false

# Domínios apex a monitorar. Aceita formas tolerantes (https://x.com/path,
# X.COM:443, *.x.com) — são normalizadas para o apex canônico e deduplicadas.
targets:
  - exemplo.com
  # - outrodominio.com.br

# Ponto de observação (multi-vantage). Vazio = hostname da máquina. Aparece nos
# exports e no `padme merge`, pra comparar a superfície vista de lugares diferentes.
source: ""

# Intervalo entre ciclos no modo monitor (segundos). 3600 = 1h.
interval_seconds: 3600

# Concorrência de rede e timeout (segundos) por requisição.
concurrency: 50
timeout: 8.0

# Banco de estado/histórico (SQLite).
db_path: padme.db

collectors:
  subdomains: true    # passivo — CT logs (crt.name / crt.sh)
  bruteforce: false   # ativo — resolve candidatos de uma wordlist (opcional)
  wordlist: ""        # caminho de uma wordlist (vazio = lista embutida)
  wildcard: true      # detecta curinga de DNS e filtra falso-positivo do bruteforce
  wildcard_probes: 3  # nomes aleatórios sondados p/ achar o curinga (>= 2)
  dns: true           # passivo — A/AAAA/CNAME/MX
  dns_records: true   # passivo — NS + SPF/DMARC do apex (delegação / spoofing)
  http: true          # ativo leve — 1 GET por host
  tls: true           # ativo leve — handshake p/ ler o certificado
  cert_expiry_days: 14  # avisa quando o cert está a <= N dias de expirar
  max_response_bytes: 262144  # teto do corpo HTTP lido por host (256 KiB)
  takeover: true      # subdomain takeover (CNAME dangling + fingerprint)
  ports: false        # ativo — connect-scan (ligue com consciência)
  ports_banner: true  # banner-grab leve nas portas abertas (SSH/SMTP/FTP…)
  ports_list: [21, 22, 25, 80, 110, 143, 443, 3306, 3389, 5432, 6379, 8080, 8443]

# Política de rede (padrão SEGURO — anti-SSRF / rede interna).
network:
  # NÃO segue redirects por padrão: um "Location: http://127.0.0.1/" não deve
  # transformar o monitor em proxy pra rede interna. Quando não segue, registra
  # o destino do redirect.
  follow_redirects: false
  # NÃO sonda ativamente (HTTP/TLS/portas) hosts que resolvem para IP
  # privado/reservado (10/8, 192.168/16, 127/8, link-local, ULA IPv6...).
  # DNS passivo continua. Ligue só se realmente monitora rede interna.
  allow_private_ips: false

# Armazenamento / retenção do histórico (o `state` nunca é apagado).
storage:
  event_retention_days: 0   # 0 = mantém tudo; > 0 apaga eventos mais antigos

telegram:
  enabled: true
  # limiar mínimo de severidade enviado ao Telegram (o terminal sempre mostra tudo):
  #   debug    = tudo (inclui DNS)
  #   low      = remoções e mudanças menores
  #   medium   = HTTP/TLS mudou, serviço novo   (padrão)
  #   high     = porta nova / subdomínio novo
  #   critical = só subdomain takeover
  level: medium
  # Dica: use variáveis de ambiente para não versionar segredos:
  #   bot_token: ${PADME_TG_TOKEN}
  #   chat_id:   ${PADME_TG_CHAT}
  bot_token: "SEU_BOT_TOKEN_AQUI"
  chat_id: "SEU_CHAT_ID_AQUI"

# Cada canal tem seu PRÓPRIO limiar de severidade (política por canal): o
# terminal mostra tudo; cada canal decide o que recebe pelo seu `level`.

# Discord — cole a URL de um Webhook de canal (Configurações do canal → Integrações).
discord:
  enabled: false
  webhook_url: ${PADME_DISCORD_WEBHOOK}
  level: medium

# Webhook genérico — recebe um JSON estruturado a cada mudança (ideal p/ n8n).
# Payload: { schema_version, source, type, target, time, count, events[], text }
webhook:
  enabled: false
  url: ${PADME_WEBHOOK_URL}
  level: debug          # sink de automação: por padrão recebe o fluxo completo
  headers: {}           # opcional — auth do seu endpoint, ex.: {X-Padme-Token: "${PADME_WEBHOOK_TOKEN}"}

# Heartbeat / dead-man's switch — a Padmé avisa que está viva a cada N ciclos.
# Um processo morto não avisa que morreu, então o sinal vai pra um watchdog
# externo (healthchecks.io, Uptime Kuma, cronitor...): se o ping some, ELE te
# alerta. `file` grava o timestamp da última vida localmente (opcional).
heartbeat:
  enabled: false
  url: ${PADME_HEARTBEAT_URL}   # sucesso -> GET url ; falha no ciclo -> GET url/fail
  every_cycles: 1               # emite o sinal a cada N ciclos
  file: ""                      # ex.: /tmp/padme.alive (opcional)

# E-mail (SMTP com STARTTLS). Para Gmail, use uma "App Password".
email:
  enabled: false
  smtp_host: smtp.gmail.com
  smtp_port: 587
  username: ${PADME_SMTP_USER}
  password: ${PADME_SMTP_PASS}
  from: ${PADME_SMTP_USER}
  to:
    - voce@dominio.com
  use_tls: true
  level: high           # e-mail costuma querer só o que importa
