name: tests

on:
  push:
  pull_request:
  schedule:
    # semanal: CVE nova numa dependência aparece sem ninguém dar push
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar dependências (versões fixas)
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check padme tests scripts
      - name: Compileall
        run: python -m compileall -q padme
      - name: Testes
        run: pytest -q

  audit:
    # Uma ferramenta de segurança audita as próprias dependências: falha se o
    # lock (requirements.txt) tiver vulnerabilidade conhecida.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar pip-audit
        run: pip install pip-audit==2.10.1
      - name: Auditar dependências
        run: pip-audit -r requirements.txt

  docker:
    # A imagem é o modo de uso principal (sentinela 24/7): build de verdade +
    # smoke test do que só aparece num container (entrypoint, usuário sem
    # privilégio, HEALTHCHECK, dados empacotados, SIGTERM no PID 1).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar docker-compose.yml
        run: docker compose config -q
      - name: Build da imagem
        run: docker build -t padme:ci .
      - name: Smoke test da imagem
        run: sh scripts/docker-smoke.sh padme:ci
