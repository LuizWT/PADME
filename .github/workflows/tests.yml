name: tests

on:
  push:
  pull_request:
  schedule:
    # semanal: CVE nova numa dependência aparece sem ninguém dar push
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar dependências (versões fixas)
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check padme tests scripts
      - name: Compileall
        run: python -m compileall -q padme
      - name: Tipos (mypy)
        if: matrix.python-version == '3.12'
        run: mypy
      - name: Testes
        run: pytest -q

  pacote:
    # O que vai para o PyPI: metadados válidos, README que o PyPI renderiza e os
    # dados do pacote (base de takeover, logo do painel) dentro do wheel.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Ferramentas (versões fixas)
        run: pip install -r requirements-dev.txt
      - name: Gerar sdist e wheel
        run: python -m build
      - name: Conferir metadados (twine)
        run: twine check --strict dist/*
      - name: Instalar o wheel num ambiente limpo
        run: |
          versao=$(python -c "import padme; print(padme.__version__)")
          python -m venv "$RUNNER_TEMP/limpo"
          "$RUNNER_TEMP/limpo/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          test "$("$RUNNER_TEMP/limpo/bin/padme" --version)" = "padme $versao"
          "$RUNNER_TEMP/limpo/bin/python" -c "from padme.collectors.takeover import FINGERPRINTS; from padme.web.assets import _LOGO; assert FINGERPRINTS and _LOGO.startswith('data:image/png')"

  audit:
    # Uma ferramenta de segurança audita as próprias dependências: falha se o
    # lock (requirements.txt) tiver vulnerabilidade conhecida.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Instalar pip-audit
        run: pip install pip-audit==2.10.1
      - name: Auditar dependências
        run: pip-audit -r requirements.txt

  docker:
    # A imagem é o modo de uso principal (sentinela 24/7): build de verdade +
    # smoke test do que só aparece num container (entrypoint, usuário sem
    # privilégio, HEALTHCHECK, dados empacotados, SIGTERM no PID 1).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validar docker-compose.yml
        run: docker compose config -q
      - name: Build da imagem
        run: docker build -t padme:ci .
      - name: Smoke test da imagem
        run: sh scripts/docker-smoke.sh padme:ci
