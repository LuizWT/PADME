name: install

# Roda os instaladores de verdade, como um usuário faria, nos três sistemas:
# instala a partir do checkout, confere que o comando `padme` funciona sem
# "python" na frente, cria um config sem perguntas e desinstala.
on:
  push:
    paths: ["install.*", "padme/**", "pyproject.toml", ".github/workflows/install.yml"]
  pull_request:
    paths: ["install.*", "padme/**", "pyproject.toml", ".github/workflows/install.yml"]
  workflow_dispatch:

jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Instalar (sh install.sh)
        run: sh install.sh < /dev/null
      - name: Comando padme sem python na frente
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          cd "$RUNNER_TEMP"
          padme --version
          padme -h | grep -q "monitor"
          padme init --target example.com --yes
          padme doctor || true
          test -f "$HOME/.config/padme/config.yaml"
      - name: Desinstalar
        run: |
          sh install.sh --uninstall
          test ! -e "$HOME/.local/bin/padme"
          test -f "$HOME/.config/padme/config.yaml"   # config fica

  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PADME_NO_PAUSE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Instalar (install.bat, como no duplo clique)
        shell: cmd
        run: install.bat < NUL
      - name: Comando padme sem python na frente
        shell: pwsh
        run: |
          $bin = Join-Path $env:LOCALAPPDATA 'padme\bin'
          $userPath = (Get-ItemProperty 'HKCU:\Environment').Path
          if (-not ($userPath -split ';' | Where-Object { $_.TrimEnd('\') -eq $bin })) { throw "PATH do usuario sem $bin" }
          $env:Path = "$env:Path;$bin"
          Set-Location $env:RUNNER_TEMP
          padme --version
          if (-not ((padme -h) -match 'monitor')) { throw 'ajuda sem os comandos' }
          padme init --target example.com --yes
          if ($LASTEXITCODE -ne 0) { throw 'init falhou' }
          if (-not (Test-Path (Join-Path $env:APPDATA 'padme\config.yaml'))) { throw 'config nao criado' }
      - name: Comando padme no Prompt de Comando
        shell: cmd
        run: |
          set "PATH=%PATH%;%LOCALAPPDATA%\padme\bin"
          padme --version
      - name: Trava de instância única no Windows (msvcrt)
        shell: pwsh
        run: |
          $py = Join-Path $env:LOCALAPPDATA 'padme\venv\Scripts\python.exe'
          @'
          import os, tempfile
          from padme.singleton import AlreadyRunning, _MODE, single_instance
          assert _MODE == "msvcrt", _MODE
          lock = os.path.join(tempfile.gettempdir(), "padme-ci.lock")
          with single_instance(lock):
              try:
                  with single_instance(lock):
                      raise SystemExit("a segunda instância não devia conseguir a trava")
              except AlreadyRunning:
                  pass
          with single_instance(lock):   # liberada ao sair do bloco
              pass
          print("trava ok")
          '@ | & $py -
          if ($LASTEXITCODE -ne 0) { throw 'trava de instancia unica falhou' }
      - name: padme service (tarefa no Agendador de Tarefas)
        shell: pwsh
        run: |
          $env:Path = "$env:Path;" + (Join-Path $env:LOCALAPPDATA 'padme\bin')
          padme service install --no-start
          if ($LASTEXITCODE -ne 0) { throw 'service install falhou' }
          [xml]$task = schtasks /Query /TN Padme /XML | Out-String
          if ($LASTEXITCODE -ne 0) { throw 'tarefa nao registrada' }
          $exec = $task.Task.Actions.Exec
          if ($exec.Command -notmatch 'pythonw\.exe$') { throw "sem pythonw: $($exec.Command)" }
          if ($exec.Arguments -notmatch '--log-file' -or $exec.Arguments -notmatch '--lock') { throw "argumentos: $($exec.Arguments)" }
          if (-not $task.Task.Triggers.LogonTrigger) { throw 'sem gatilho de logon' }
          padme service status
          if ($LASTEXITCODE -ne 0) { throw 'service status falhou' }
          padme service uninstall
          if ($LASTEXITCODE -ne 0) { throw 'service uninstall falhou' }
          schtasks /Query /TN Padme 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw 'tarefa nao foi removida' }
          $global:LASTEXITCODE = 0
      - name: O comando da tarefa roda sem janela e grava o log
        shell: pwsh
        run: |
          $py = Join-Path $env:LOCALAPPDATA 'padme\venv\Scripts\python.exe'
          @'
          import subprocess
          from padme import winservice
          from padme.paths import find_config
          cfg = find_config(None)
          exe, args = winservice.monitor_command(cfg, no_web=True)
          assert exe.lower().endswith("pythonw.exe"), exe
          # o mesmo comando da tarefa, com --once para sair depois de uma varredura
          r = subprocess.run([exe, *args, "--once"], timeout=600)
          text = winservice.log_path(cfg).read_text(encoding="utf-8")
          assert "scan conclu" in text, text[-2000:]   # so ASCII no script (stdin do python)
          print("log ok:", winservice.log_path(cfg))
          '@ | & $py -
          if ($LASTEXITCODE -ne 0) { throw 'comando da tarefa falhou' }
      - name: Reinstalar pelo modo "irm | iex" (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $env:PADME_SRC = $env:GITHUB_WORKSPACE   # o código deste checkout, não o do main
          Get-Content -Raw install.ps1 | Invoke-Expression
          & (Join-Path $env:LOCALAPPDATA 'padme\bin\padme.cmd') --version
          if ($LASTEXITCODE -ne 0) { throw 'padme nao roda depois do modo iex' }
      - name: Desinstalar
        shell: cmd
        run: install.bat -Uninstall < NUL
      - name: Conferir remoção
        shell: pwsh
        run: |
          if (Test-Path (Join-Path $env:LOCALAPPDATA 'padme\bin\padme.cmd')) { throw 'comando ficou' }
          $userPath = (Get-ItemProperty 'HKCU:\Environment').Path
          if ($userPath -match [regex]::Escape((Join-Path $env:LOCALAPPDATA 'padme\bin'))) { throw 'PATH ficou' }
          if (-not (Test-Path (Join-Path $env:APPDATA 'padme\config.yaml'))) { throw 'config devia ficar' }
